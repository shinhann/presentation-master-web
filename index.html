<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 簡報達人擂台賽評審評分系統</title>

    <!-- Google Material Icons & Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 UMD & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- SheetJS (xlsx) 用於 Excel / CSV 前端解析 -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- 專案設計系統 CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="root"></div>

    <!-- 載入專案模組 -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

    <!-- 載入各功能視圖模組 (Babel JSX 轉譯) -->
    <script type="text/babel" src="js/views/login.js"></script>
    <script type="text/babel" src="js/views/judge.js"></script>
    <script type="text/babel" src="js/views/admin-teams.js"></script>
    <script type="text/babel" src="js/views/admin-judges.js"></script>
    <script type="text/babel" src="js/views/admin-config.js"></script>
    <script type="text/babel" src="js/views/admin-results.js"></script>
    <script type="text/babel" src="js/views/admin-health.js"></script>
    
    <!-- 載入主應用程式調度器 -->
    <script type="text/babel" src="js/app.js"></script>

    <!-- 啟動應用程式 -->
    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>

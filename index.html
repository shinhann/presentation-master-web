<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報達人擂台賽評分系統 (Dev)</title>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(message);
        };
    </script>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3E2723',
                        secondary: '#D84315',
                    }
                }
            }
        }
    </script>

    <!-- React 核心 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F5F5F5; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel">
    if (typeof React === 'undefined') {
        alert("錯誤：React 無法載入，請檢查網路。");
    }

    const { useState, useEffect } = React;

    // ================= CONFIG 設定區 =================

    // 1. Google Apps Script 部署網址 (後端 API)
    const API_URL = "https://script.google.com/macros/s/AKfycbwLRsiyHMiQzqyk52CBkmnASqJUznH3JWW50rzKNRNAuRGY5Ci8-IQNKxOOnxE99vLq/exec";
    
    // 2. API Key
    const API_KEY = "TEST_KEY_123"; 

    // 3. 全域組別定義 (Global Constants)
    const ALL_CATEGORIES = [
      "宜蘭在地國中組", "宜蘭在地國小組",
      "環境永續國中組", "環境永續國小組",
      "校訂課程國中組", "校訂課程國小組"
    ];

    // =================================================================

    // --- 登入頁面元件 (Login) ---
    const Login = ({ onLoginSuccess }) => {
        const [userType, setUserType] = useState('judge');
        const [formData, setFormData] = useState({ id: '', password: '' });
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        
        const [judgeList, setJudgeList] = useState([]);
        const [isListLoading, setIsListLoading] = useState(false);

        useEffect(() => {
            if (userType === 'judge') {
                fetchJudgeList();
            }
        }, [userType]);

        const fetchJudgeList = async () => {
            setIsListLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getJudgeList',
                        API_Key: API_KEY
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    setJudgeList(result.data);
                } else {
                    console.warn("無法載入評審名單:", result.message);
                }
            } catch (err) {
                console.error("無法載入評審名單", err);
                setError("無法連接伺服器讀取評審名單");
            } finally {
                setIsListLoading(false);
            }
        };

        const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
            if (error) setError('');
        };

        const handleUserTypeChange = (e) => {
            setUserType(e.target.value);
            setFormData({ id: '', password: '' });
            setError('');
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');

            if (userType === 'judge' && !formData.id) {
                setError('請選擇評審姓名');
                setLoading(false);
                return;
            }
            if (!formData.password) {
                setError('請輸入密碼');
                setLoading(false);
                return;
            }

            try {
                const payload = {
                    action: 'login',
                    API_Key: API_KEY, 
                    user_type: userType,
                    id: userType === 'judge' ? formData.id : '', 
                    password: formData.password
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    const userData = { ...result.data, role: userType === 'admin' ? 'admin' : 'judge' };
                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    onLoginSuccess(userData);
                } else {
                    setError(result.message || '登入失敗，請檢查帳號密碼。');
                }

            } catch (err) {
                console.error('Login Error:', err);
                setError('無法連接伺服器，請檢查網路或 API 網址。');
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-primary">
                    <div className="text-center mb-8">
                        <h1 className="text-2xl font-bold text-primary mb-2">114學年度 簡報達人擂台賽</h1>
                        <p className="text-gray-500 font-medium">評審評分系統</p>
                    </div>
                    {error && (
                        <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-200 flex items-center">
                            <span className="material-icons text-sm mr-2">error</span>
                            {error}
                        </div>
                    )}
                    <form onSubmit={handleLogin} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">登入身分</label>
                            <div className="relative">
                                <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">badge</span>
                                <select 
                                    value={userType}
                                    onChange={handleUserTypeChange}
                                    className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                >
                                    <option value="judge">評審委員 (Judge)</option>
                                    <option value="admin">系統管理員 (Admin)</option>
                                </select>
                            </div>
                        </div>
                        {userType === 'judge' && (
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    評審姓名
                                    {isListLoading && <span className="text-xs text-gray-400 ml-2">(資料載入中...)</span>}
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">person</span>
                                    <select 
                                        name="id" 
                                        value={formData.id} 
                                        onChange={handleChange} 
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                        disabled={isListLoading}
                                    >
                                        <option value="">{isListLoading ? "讀取中..." : "請選擇您的姓名..."}</option>
                                        {judgeList.length > 0 ? (
                                            judgeList.map((judge) => (
                                                <option key={judge.id} value={judge.id}>{judge.name}</option>
                                            ))
                                        ) : (
                                            !isListLoading && <option value="" disabled>無可用名單</option>
                                        )}
                                    </select>
                                </div>
                            </div>
                        )}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                {userType === 'admin' ? '管理員密碼' : '登入密碼'}
                            </label>
                            <div className="relative">
                                <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">lock</span>
                                <input
                                    type="password"
                                    name="password"
                                    value={formData.password}
                                    onChange={handleChange}
                                    placeholder="請輸入密碼"
                                    className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary"
                                />
                            </div>
                        </div>
                        <button 
                            type="submit"
                            disabled={loading}
                            className={`w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors
                                ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                            `}
                        >
                            {loading ? "登入驗證中..." : "登入系統"}
                        </button>
                    </form>
                </div>
            </div>
        );
    };

    // --- 核心功能：評審管理元件 (JudgeManager) ---jan 24 20:21 update
    const JudgeManager = () => {
        const [judges, setJudges] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        // Modal 狀態
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [modalMode, setModalMode] = useState('add'); // 'add' | 'edit'
        const [isSaving, setIsSaving] = useState(false);
        
        // 表單狀態
        const [formData, setFormData] = useState({
            id: '',
            name: '',
            password: '',
            categories: [], // Array
            year: '' // 用來記錄編輯時的年份，供內部參考
        });

        // 1. 讀取評審資料 (Read & Sort)
        const fetchJudges = async () => {
            setIsLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getAllJudges',
                        API_Key: API_KEY
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    // 資料排序：年度降序 (最新的在上面)
                    const sortedData = result.data.sort((a, b) => {
                        const yearA = a.competition_year || a.year || 0;
                        const yearB = b.competition_year || b.year || 0;
                        return yearB - yearA; 
                    });
                    setJudges(sortedData);
                    console.log('Judges Loaded:', sortedData);
                } else {
                    alert("讀取失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("連線錯誤，無法讀取評審列表");
            } finally {
                setIsLoading(false);
            }
        };

        useEffect(() => {
            fetchJudges();
        }, []);

        // 2. 刪除資料 (Delete)
        const handleDelete = async (judge) => {
            const judgeName = judge.judge_name || judge.name;
            const confirmDelete = window.confirm(`確定要刪除評審「${judgeName}」嗎？\n此動作無法復原。`);
            
            if (!confirmDelete) return;

            // 取得正確的識別參數
            const targetCode = judge.judge_code || judge.id;
            const targetYear = judge.competition_year || judge.year;

            setIsLoading(true); // 顯示全域 Loading
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteJudge',
                        API_Key: API_KEY,
                        judge_code: targetCode,
                        competition_year: targetYear
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('刪除成功');
                    fetchJudges(); // 重新整理列表
                } else {
                    alert('刪除失敗：' + result.message);
                    setIsLoading(false);
                }
            } catch (err) {
                console.error(err);
                alert('刪除時發生錯誤');
                setIsLoading(false);
            }
        };

        // 3. 開啟 Modal (新增/編輯)
        const openModal = (mode, judge = null) => {
            setModalMode(mode);
            if (mode === 'edit' && judge) {
                setFormData({
                    id: judge.judge_code || judge.id,
                    name: judge.judge_name || judge.name,
                    password: judge.password || '', 
                    categories: Array.isArray(judge.categories) ? judge.categories : [],
                    year: judge.competition_year || judge.year // 保留年份資料
                });
            } else {
                setFormData({ id: '', name: '', password: '', categories: [], year: '' });
            }
            setIsModalOpen(true);
        };

        // 4. 表單欄位變更
        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        // 5. Checkbox 勾選邏輯
        const handleCategoryToggle = (category) => {
            setFormData(prev => {
                const currentCats = prev.categories || [];
                if (currentCats.includes(category)) {
                    return { ...prev, categories: currentCats.filter(c => c !== category) };
                } else {
                    return { ...prev, categories: [...currentCats, category] };
                }
            });
        };

        // 6. 儲存資料 (Save)
        const handleSave = async () => {
            if (!formData.id || !formData.name || !formData.password) {
                alert("代碼、姓名與密碼為必填欄位！");
                return;
            }

            setIsSaving(true);
            try {
                const payload = {
                    action: 'saveJudge',
                    API_Key: API_KEY,
                    judge_code: formData.id,
                    judge_name: formData.name,
                    password: formData.password,
                    categories: formData.categories // Array
                    // 注意：這裡我們不傳 competition_year，交由後端處理 (新增時為今年，編輯時後端應保留原年份或更新)
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    setIsModalOpen(false);
                    fetchJudges(); 
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("連線錯誤，無法儲存");
            } finally {
                setIsSaving(false);
            }
        };

        return (
            <div className="bg-white rounded shadow-md p-6">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-gray-800 flex items-center">
                        <span className="material-icons mr-2 text-primary">manage_accounts</span>
                        評審帳號管理
                    </h2>
                    <button 
                        onClick={() => openModal('add')}
                        className="bg-secondary hover:bg-orange-700 text-white px-4 py-2 rounded shadow flex items-center transition"
                    >
                        <span className="material-icons text-sm mr-1">add</span>
                        新增評審
                    </button>
                </div>

                {/* Table 顯示區 */}
                <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-gray-200 border">
                        <thead className="bg-gray-50">
                            <tr>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年度</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">代碼</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">負責組別</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">密碼</th>
                                <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
<tbody className="bg-white divide-y divide-gray-200">
                            {isLoading ? (
                                <tr><td colSpan="11" className="px-6 py-4 text-center text-gray-500">載入中...</td></tr>
                            ) : filteredTeams.length === 0 ? (
                                <tr><td colSpan="11" className="px-6 py-4 text-center text-gray-500">
                                    {searchTerm ? '找不到符合關鍵字的隊伍' : '目前無參賽隊伍資料'}
                                </td></tr>
                            ) : (
                                filteredTeams.map((team, index) => (
                                    <tr key={team.Team_ID || index} className="hover:bg-gray-50 border-b">
                                        {/* 1. 年度 */}
                                        <td className="px-3 py-4 text-sm text-gray-500 whitespace-nowrap">
                                            {team.Competition_Year || '114'}
                                        </td>
                                        
                                        {/* 2. 參賽組別 (讀取 Group_Name) */}
                                        <td className="px-3 py-4 text-sm whitespace-nowrap">
                                            <span className="px-2 py-1 font-semibold text-green-700 bg-green-100 rounded-full text-xs">
                                                {team.Group_Name}
                                            </span>
                                        </td>

                                        {/* 3. 學校 (讀取 School) */}
                                        <td className="px-3 py-4 text-sm text-gray-700 font-medium whitespace-nowrap">
                                            {team.School}
                                        </td>

                                        {/* 4. 作品名稱 (讀取 Work_Title) */}
                                        <td className="px-3 py-4 text-sm font-bold text-gray-900 max-w-[160px] truncate" title={team.Work_Title}>
                                            {team.Work_Title}
                                        </td>

                                        {/* 5. 作品說明 (讀取 Description) */}
                                        <td className="px-3 py-4 text-sm text-gray-500 max-w-xs truncate" title={team.Description}>
                                            {team.Description}
                                        </td>

                                        {/* 6. 連結圖示區 (MindMap_Link 等) */}
                                        <td className="px-2 py-4 text-center">
                                            {team.MindMap_Link ? (
                                                <a href={team.MindMap_Link} target="_blank" rel="noreferrer" className="text-blue-500 hover:text-blue-700 no-underline" title="心智圖">
                                                    <span className="text-xl">🗺️</span>
                                                </a>
                                            ) : (
                                                <span className="opacity-20 text-xl cursor-default">🗺️</span>
                                            )}
                                        </td>
                                        <td className="px-2 py-4 text-center">
                                            {team.Slides_Link ? (
                                                <a href={team.Slides_Link} target="_blank" rel="noreferrer" className="text-orange-500 hover:text-orange-700 no-underline" title="簡報">
                                                    <span className="text-xl">📊</span>
                                                </a>
                                            ) : (
                                                <span className="opacity-20 text-xl cursor-default">📊</span>
                                            )}
                                        </td>
                                        <td className="px-2 py-4 text-center">
                                            {team.Video_Link ? (
                                                <a href={team.Video_Link} target="_blank" rel="noreferrer" className="text-red-500 hover:text-red-700 no-underline" title="影片">
                                                    <span className="text-xl">🎬</span>
                                                </a>
                                            ) : (
                                                <span className="opacity-20 text-xl cursor-default">🎬</span>
                                            )}
                                        </td>
                                        <td className="px-2 py-4 text-center">
                                            {team.Drive_Link ? (
                                                <a href={team.Drive_Link} target="_blank" rel="noreferrer" className="text-green-600 hover:text-green-800 no-underline" title="雲端">
                                                    <span className="text-xl">☁️</span>
                                                </a>
                                            ) : (
                                                <span className="opacity-20 text-xl cursor-default">☁️</span>
                                            )}
                                        </td>

                                        {/* 7. 備註 (讀取 Memo) */}
                                        <td className="px-3 py-4 text-sm text-gray-500 max-w-[100px] truncate" title={team.Memo}>
                                            {team.Memo}
                                        </td>

                                        {/* 8. 操作按鈕 (整合現有功能) */}
                                        <td className="px-3 py-4 text-sm text-right whitespace-nowrap">
                                            <button 
                                                onClick={() => openModal('edit', team)} 
                                                className="text-indigo-600 hover:text-indigo-900 mr-3 font-medium"
                                            >
                                                編輯
                                            </button>
                                            <button 
                                                onClick={() => handleDelete(team.Team_ID, team.Group_Name)} 
                                                className="text-red-600 hover:text-red-900 font-medium"
                                            >
                                                刪除
                                            </button>
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>

                {/* Modal 視窗 */}
                {isModalOpen && (
                    <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                        <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                            {/* 背景遮罩 */}
                            <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onClick={() => setIsModalOpen(false)}></div>
                            <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                            
                            <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                                <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                    <h3 className="text-lg leading-6 font-medium text-gray-900 mb-4">
                                        {modalMode === 'add' ? '新增評審' : '編輯評審資料'}
                                    </h3>
                                    <div className="space-y-4">
                                        {/* ID */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">代碼 (ID)</label>
                                            <input 
                                                type="text" 
                                                name="id"
                                                value={formData.id}
                                                onChange={handleInputChange}
                                                disabled={modalMode === 'edit'} 
                                                className={`mt-1 block w-full border rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm 
                                                    ${modalMode === 'edit' ? 'bg-gray-100 text-gray-500 border-gray-300' : 'border-gray-300'}
                                                `}
                                                placeholder="例如：J01"
                                            />
                                        </div>
                                        {/* Name */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">姓名</label>
                                            <input 
                                                type="text" 
                                                name="name"
                                                value={formData.name}
                                                onChange={handleInputChange}
                                                className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                placeholder="評審真實姓名"
                                            />
                                        </div>
                                        {/* Password */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">密碼</label>
                                            <input 
                                                type="text" 
                                                name="password"
                                                value={formData.password}
                                                onChange={handleInputChange}
                                                className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                placeholder="登入密碼"
                                            />
                                        </div>
                                        {/* Categories (Checkbox Group) */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">負責組別 (多選)</label>
                                            <div className="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded border border-gray-200 max-h-48 overflow-y-auto">
                                                {ALL_CATEGORIES.map(cat => (
                                                    <label key={cat} className="flex items-center space-x-2 cursor-pointer p-1 hover:bg-gray-100 rounded">
                                                        <input 
                                                            type="checkbox"
                                                            className="form-checkbox text-secondary h-4 w-4"
                                                            checked={formData.categories.includes(cat)}
                                                            onChange={() => handleCategoryToggle(cat)}
                                                        />
                                                        <span className="text-sm text-gray-700">{cat}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                                    <button 
                                        type="button" 
                                        onClick={handleSave}
                                        disabled={isSaving}
                                        className={`w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white sm:ml-3 sm:w-auto sm:text-sm
                                            ${isSaving ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                                        `}
                                    >
                                        {isSaving ? '儲存中...' : '儲存'}
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setIsModalOpen(false)}
                                        className="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm"
                                    >
                                        取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

// --- 隊伍資源管理元件 (TeamManager) ---
    // 接收來自 AdminDashboard 傳下來的 selectedYear
    const TeamManager = ({ selectedYear }) => {
        const [teams, setTeams] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        
        // --- 搜尋與篩選 State ---
        const [searchTerm, setSearchTerm] = useState('');
        const [filterGroup, setFilterGroup] = useState('All');

        // Modal 相關狀態
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [modalMode, setModalMode] = useState('add');
        const [activeModalTab, setActiveModalTab] = useState('basic'); 
        const [isSaving, setIsSaving] = useState(false);
        const [editingTeam, setEditingTeam] = useState(null);

        // 初始表單狀態 (扁平化結構)
        const initialFormState = {
            Team_ID: '',
            Competition_Year: selectedYear, // 預設帶入全域年度
            
            // 基本資料
            Group_Name: ALL_CATEGORIES[0],
            Team_Name: '',
            School: '',
            Work_Title: '',
            Description: '',
            Category: '',
            
            // 學生資料
            Student1_Name: '', Student1_Email: '',
            Student2_Name: '', Student2_Email: '',
            Student3_Name: '', Student3_Email: '',
            
            // 老師資料
            Teacher1_Name: '', Teacher1_Email: '',
            Teacher2_Name: '', Teacher2_Email: '',
            
            // 聯絡人
            Contact_Person: '',
            Contact_Phone: '',
            
            // 連結
            MindMap_Link: '',
            Slides_Link: '',
            Video_Link: '',
            Consent_Link: '',
            Drive_Link: '',
            
            // 備註
            Link_Note: '',
            Memo: ''
        };

        const [formData, setFormData] = useState(initialFormState);

        // 1. 讀取隊伍資料
        const fetchTeams = async () => {
            setIsLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    // API payload 補上 year
                    body: JSON.stringify({ action: 'getAllTeams', API_Key: API_KEY, year: selectedYear })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    const sorted = result.data.sort((a, b) => {
                        return (a.Group_Name || '').localeCompare(b.Group_Name || '');
                    });
                    setTeams(sorted);
                } else {
                    setTeams([]);
                }
            } catch (err) {
                console.error("Fetch Teams Error:", err);
                alert("無法讀取隊伍資料");
                setTeams([]);
            } finally {
                setIsLoading(false);
            }
        };

        // 當 selectedYear 改變時，自動重新撈取資料
        useEffect(() => {
            fetchTeams();
        }, [selectedYear]);

        // --- 搜尋與篩選邏輯 ---
        const getDeepString = (obj) => {
            if (!obj) return '';
            if (typeof obj === 'string' || typeof obj === 'number') return String(obj).toLowerCase();
            if (typeof obj === 'object') {
                return Object.values(obj).map(val => getDeepString(val)).join(' ');
            }
            return '';
        };

        const uniqueGroups = [...new Set(teams.map(t => t.Group_Name).filter(Boolean))].sort();

        const filteredTeams = teams.filter(team => {
            if (filterGroup !== 'All' && team.Group_Name !== filterGroup) return false;
            if (!searchTerm) return true;
            return getDeepString(team).includes(searchTerm.toLowerCase());
        });

        const getGroupColor = (groupName) => {
            if (!groupName) return 'bg-gray-100 text-gray-800';
            const name = groupName.toString();
            if (name.includes('宜蘭')) return 'bg-green-100 text-green-800';
            if (name.includes('環境')) return 'bg-blue-100 text-blue-800';
            if (name.includes('校訂')) return 'bg-orange-100 text-orange-800';
            return 'bg-gray-100 text-gray-800';
        };

        // --- 表單處理邏輯 ---
        const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        const quickImportContact = (teacherNum) => {
            const name = formData[`Teacher${teacherNum}_Name`];
            if (name) {
                setFormData(prev => ({ ...prev, Contact_Person: name }));
            } else {
                alert("該指導老師姓名為空");
            }
        };

        // 2. 開啟 Modal
        const openModal = (mode, team = null) => {
            setModalMode(mode);
            setActiveModalTab('basic');

            if (mode === 'edit' && team) {
                setEditingTeam(team);
                setFormData({
                    ...initialFormState,
                    ...team 
                });
            } else {
                setEditingTeam(null);
                setFormData({
                    ...initialFormState,
                    Competition_Year: selectedYear // 確保新增時帶入當前選定年度
                });
            }
            setIsModalOpen(true);
        };

        // 3. 儲存資料
        const handleSave = async () => {
            if (!formData.Competition_Year || !formData.School || !formData.Group_Name) {
                alert("請填寫年度、學校與參賽組別等基本資料");
                return;
            }

            setIsSaving(true);
            try {
                const payload = {
                    action: 'saveTeam',
                    API_Key: API_KEY,

                    Team_ID: editingTeam?.Team_ID || '', 
                    Competition_Year: formData.Competition_Year,
                    
                    Category: formData.Category,
                    Group_Name: formData.Group_Name,
                    Team_Name: formData.Team_Name,
                    School: formData.School,
                    Work_Title: formData.Work_Title,
                    Description: formData.Description,

                    Student1_Name: formData.Student1_Name, Student1_Email: formData.Student1_Email,
                    Student2_Name: formData.Student2_Name, Student2_Email: formData.Student2_Email,
                    Student3_Name: formData.Student3_Name, Student3_Email: formData.Student3_Email,

                    Teacher1_Name: formData.Teacher1_Name, Teacher1_Email: formData.Teacher1_Email,
                    Teacher2_Name: formData.Teacher2_Name, Teacher2_Email: formData.Teacher2_Email,

                    Contact_Person: formData.Contact_Person,
                    Contact_Phone: formData.Contact_Phone,
                    
                    MindMap_Link: formData.MindMap_Link,
                    Slides_Link: formData.Slides_Link,
                    Video_Link: formData.Video_Link,
                    Consent_Link: formData.Consent_Link,
                    Drive_Link: formData.Drive_Link,
                    
                    Link_Note: formData.Link_Note,
                    Memo: formData.Memo
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    setIsModalOpen(false);
                    fetchTeams();
                } else {
                    alert("儲存失敗: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("儲存錯誤");
            } finally {
                setIsSaving(false);
            }
        };

        const handleDelete = async (teamId, teamName) => {
            if (!confirm(`確定要刪除隊伍「${teamName}」嗎？`)) return;
            setIsLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    // API payload 補上 year，確保刪除對應年度資料
                    body: JSON.stringify({ action: 'deleteTeam', API_Key: API_KEY, team_id: teamId, year: selectedYear })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert("刪除成功");
                    fetchTeams();
                } else {
                    alert("刪除失敗: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("刪除錯誤");
            } finally {
                setIsLoading(false);
            }
        };

        return (
            <div className="bg-white rounded shadow-md p-6 mt-6">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <span className="material-icons text-primary">groups</span>
                        參賽隊伍管理 <span className="text-sm font-normal text-gray-500 ml-2">({selectedYear} 年度)</span>
                    </h2>
                    <button 
                        onClick={() => openModal('add')}
                        className="bg-secondary hover:bg-orange-700 text-white px-4 py-2 rounded shadow flex items-center transition"
                    >
                        <span className="material-icons text-sm mr-1">add</span>
                        新增隊伍
                    </button>
                </div>

                {/* 工具列 */}
                <div className="flex flex-col sm:flex-row gap-4 mb-4 bg-gray-50 p-4 rounded border">
                    <div className="flex-1 relative">
                        <span className="material-icons absolute left-3 top-2.5 text-gray-400">search</span>
                        <input
                            type="text"
                            placeholder="搜尋關鍵字 (姓名、學校、電話、備註...)"
                            className="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    <div className="sm:w-1/4">
                        <select
                            className="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-secondary bg-white"
                            value={filterGroup}
                            onChange={(e) => setFilterGroup(e.target.value)}
                        >
                            <option value="All">全部組別 (Group)</option>
                            {uniqueGroups.map((group, idx) => (
                                <option key={idx} value={group}>{group}</option>
                            ))}
                        </select>
                    </div>
                </div>

                {/* 表格 */}
                <div className="max-h-[600px] overflow-y-auto border rounded-lg shadow relative">
                    <table className="min-w-full divide-y divide-gray-200">
                        <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                            <tr>
                                {['年度', '參賽組別', '學校', '作品名稱', '作品說明', '心智圖', '簡報', '影片', '雲端', '備註', '操作'].map((h, i) => (
                                    <th key={h} className={`px-3 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap bg-gray-50
                                        ${i >= 5 && i <= 8 ? 'text-center' : 'text-left'}
                                        ${i === 10 ? 'text-right' : ''}
                                    `}>
                                        {h}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                            {isLoading ? (
                                <tr><td colSpan="11" className="px-6 py-4 text-center text-gray-500">載入中...</td></tr>
                            ) : filteredTeams.length === 0 ? (
                                <tr><td colSpan="11" className="px-6 py-4 text-center text-gray-500">
                                    {searchTerm ? '找不到符合關鍵字的隊伍' : '此年度目前無參賽隊伍資料'}
                                </td></tr>
                            ) : (
                                filteredTeams.map((team, index) => {
                                    const teamId = team.Team_ID || team.id || index;
                                    
                                    // 連結資料處理
                                    const linkMindmap = team.MindMap_Link || team.Link_Mindmap;
                                    const linkSlides = team.Slides_Link || team.Link_Slides;
                                    const linkVideo = team.Video_Link || team.Link_Video;
                                    const linkDrive = team.Drive_Link || team.Link_Drive;

                                    return (
                                        <tr key={teamId} className="hover:bg-gray-50 border-b">
                                            <td className="px-3 py-4 text-sm text-gray-500 whitespace-nowrap">{team.Competition_Year || team.Year || selectedYear}</td>
                                            
                                            <td className="px-3 py-4 text-sm whitespace-nowrap">
                                                <span className={`px-2 py-1 font-semibold text-xs rounded-full whitespace-nowrap ${getGroupColor(team.Group_Name)}`}>
                                                    {team.Group_Name}
                                                </span>
                                            </td>

                                            <td className="px-3 py-4 text-sm text-gray-700 whitespace-nowrap">{team.School}</td>
                                            <td className="px-3 py-4 text-sm font-bold text-gray-900 max-w-[160px] truncate" title={team.Work_Title}>{team.Work_Title}</td>
                                            <td className="px-3 py-4 text-sm text-gray-500 max-w-xs truncate" title={team.Description}>{team.Description}</td>

                                            <td className="px-2 py-4 text-center">
                                                {linkMindmap ? <a href={linkMindmap} target="_blank" rel="noreferrer" className="no-underline text-xl">🗺️</a> : <span className="opacity-20 text-xl grayscale cursor-default">🗺️</span>}
                                            </td>
                                            <td className="px-2 py-4 text-center">
                                                {linkSlides ? <a href={linkSlides} target="_blank" rel="noreferrer" className="no-underline text-xl">📊</a> : <span className="opacity-20 text-xl grayscale cursor-default">📊</span>}
                                            </td>
                                            <td className="px-2 py-4 text-center">
                                                {linkVideo ? <a href={linkVideo} target="_blank" rel="noreferrer" className="no-underline text-xl">🎬</a> : <span className="opacity-20 text-xl grayscale cursor-default">🎬</span>}
                                            </td>
                                            <td className="px-2 py-4 text-center">
                                                {linkDrive ? <a href={linkDrive} target="_blank" rel="noreferrer" className="no-underline text-xl">☁️</a> : <span className="opacity-20 text-xl grayscale cursor-default">☁️</span>}
                                            </td>

                                            <td className="px-3 py-4 text-sm text-gray-500 max-w-[100px] truncate" title={team.Memo}>{team.Memo}</td>

                                            <td className="px-3 py-4 text-sm text-right whitespace-nowrap">
                                                <button onClick={() => openModal('edit', team)} className="text-indigo-600 hover:text-indigo-900 mr-3 font-medium">編輯</button>
                                                <button onClick={() => handleDelete(teamId, team.Group_Name)} className="text-red-600 hover:text-red-900 font-medium">刪除</button>
                                            </td>
                                        </tr>
                                    );
                                })
                            )}
                        </tbody>
                    </table>
                </div>

                {/* Edit Modal (UX 改版) */}
                {isModalOpen && (
                    <div className="fixed inset-0 z-50 overflow-y-auto">
                        <div className="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
                            <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onClick={() => setIsModalOpen(false)}></div>
                            <span className="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                            
                            <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl w-full">
                                
                                {/* Header */}
                                <div className="bg-gray-800 px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-white flex items-center">
                                        <span className="material-icons mr-2">{modalMode === 'add' ? 'add_circle' : 'edit_note'}</span>
                                        {modalMode === 'add' ? '新增參賽隊伍' : '編輯隊伍資料'}
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white transition-colors">
                                        <span className="material-icons">close</span>
                                    </button>
                                </div>

                                {/* Content Area */}
                                <div className="px-6 py-6 max-h-[75vh] overflow-y-auto bg-gray-50">
                                    
                                    {/* --- 1. 基本資料區塊 --- */}
                                    <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200 mb-6 relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center border-b pb-2">
                                            <span className="material-icons text-blue-500 mr-2 text-base">info</span>
                                            基本資料
                                        </h3>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                            {/* 年度 (唯讀) */}
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-semibold text-gray-700 mb-1">年度</label>
                                                <input 
                                                    type="text" 
                                                    name="Competition_Year" 
                                                    value={formData.Competition_Year} 
                                                    readOnly 
                                                    className="w-full bg-gray-100 border border-gray-300 rounded px-3 py-2 text-gray-500 cursor-not-allowed text-center font-mono font-bold"
                                                />
                                            </div>

                                            {/* 組別 (下拉選單) */}
                                            <div className="md:col-span-4">
                                                <label className="block text-sm font-semibold text-gray-700 mb-1">參賽組別</label>
                                                <select 
                                                    name="Group_Name" 
                                                    value={formData.Group_Name} 
                                                    onChange={handleChange} 
                                                    className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                                                >
                                                    <option value="" disabled>請選擇組別</option>
                                                    {ALL_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>

                                            {/* 學校 */}
                                            <div className="md:col-span-6">
                                                <label className="block text-sm font-semibold text-gray-700 mb-1">學校全銜</label>
                                                <input 
                                                    type="text" 
                                                    name="School" 
                                                    value={formData.School} 
                                                    onChange={handleChange} 
                                                    className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" 
                                                    placeholder="例如：宜蘭縣立復興國中" 
                                                />
                                            </div>

                                            {/* 作品名稱 (佔滿) */}
                                            <div className="md:col-span-12">
                                                <label className="block text-sm font-semibold text-gray-700 mb-1">作品名稱</label>
                                                <input

                                                    value={formData.Work_Title} 
                                                    onChange={handleChange} 
                                                    className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 font-medium"

                                                    rows="3" 
                                                    value={formData.Description} 
                                                    onChange={handleChange} 
                                                    className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500"
                                                    placeholder="請簡述作品概念..."

                                                                className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-gray-400"

// --- 系統設定與評審管理元件 (SystemSettings) ---20260228 2229
    // 接收來自 AdminDashboard 傳下來的 selectedYear
    const SystemSettings = ({ selectedYear }) => {
        const [hasConfig, setHasConfig] = useState(true);
        const [isCopying, setIsCopying] = useState(false);

        // ================= 1. 左半部：全域參數設定狀態 =================
        const [config, setConfig] = useState({
            current_year: selectedYear,
            is_registration_open: false,
            is_judging_open: false,
            categories: {} // 確保預設為物件
        });
        const [newCategory, setNewCategory] = useState('');
        const [isConfigLoading, setIsConfigLoading] = useState(false);
        const [isConfigSaving, setIsConfigSaving] = useState(false);

        // ================= 2. 右半部：評審名單狀態 =================
        const [judges, setJudges] = useState([]);
        const [isJudgesLoading, setIsJudgesLoading] = useState(false);
        const [isJudgeSaving, setIsJudgeSaving] = useState(false);

        // 評審 Modal 狀態
        const [isJudgeModalOpen, setIsJudgeModalOpen] = useState(false);
        const [judgeModalMode, setJudgeModalMode] = useState('add');
        const [judgeFormData, setJudgeFormData] = useState({
            Competition_Year: '',
            Judge_Code: '',
            Judge_Name: '',
            Password: '',
            Categories: []
        });

        // ================= 動態計算攤平的組別陣列 =================
        const flatCategories = Object.values(config.categories || {}).flat().filter(Boolean);

        // ================= 3. 資料載入 (API) =================
        const fetchSystemConfig = async () => {
            setIsConfigLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getSystemConfig', API_Key: API_KEY, year: selectedYear })
                });
                const result = await response.json();
                
                if (result.status === 'success' && result.data && Object.keys(result.data).length > 0) {
                    const data = result.data;
                    
                    // 1. 處理組別資料 (相容 categories 與 Category_Group_Map)
                    let rawCats = data.categories || data.Category_Group_Map || data.category_group_map;
                    let parsedCats = {};
                    
                    if (rawCats) {
                        if (typeof rawCats === 'string') {
                            try { parsedCats = JSON.parse(rawCats); } catch (e) { console.warn("Categories parse error"); }
                        } else if (typeof rawCats === 'object' && rawCats !== null) {
                            parsedCats = Array.isArray(rawCats) ? (rawCats.length > 0 ? { "未分類": rawCats } : {}) : rawCats;
                        }
                    }

                    // 2. 處理其他設定值 (相容前端 state 與後端 DB 欄位命名)
                    setConfig({
                        current_year: data.current_year || data.Competition_Year || selectedYear,
                        is_registration_open: data.is_registration_open ?? (data.Is_Active === true || data.Is_Active === 'TRUE'),
                        is_judging_open: data.is_judging_open ?? (data.System_Lock === false || data.System_Lock === 'FALSE'), // 假設 Lock 為 false 代表開放評分
                        categories: parsedCats
                    });
                    setHasConfig(true);
                } else {
                    setHasConfig(false);
                    setConfig({ current_year: selectedYear, is_registration_open: false, is_judging_open: false, categories: {} });
                }
            } catch (err) {
                console.warn("無法取得系統設定", err);
                setHasConfig(false);
            } finally {
                setIsConfigLoading(false);
            }
        };

        const fetchJudges = async () => {
            setIsJudgesLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getAllJudges', API_Key: API_KEY, year: selectedYear })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    const sorted = result.data.sort((a, b) => {
                        const codeA = a.judge_code || '';
                        const codeB = b.judge_code || '';
                        return codeA.localeCompare(codeB);
                    });
                    setJudges(sorted);
                } else {
                    setJudges([]); 
                }
            } catch (err) {
                console.error("無法取得評審列表", err);
                setJudges([]);
            } finally {
                setIsJudgesLoading(false);
            }
        };

        useEffect(() => {
            fetchSystemConfig();
            fetchJudges();
        }, [selectedYear]);

        // ================= 複製上年度設定邏輯 =================
        const handleCopyYearData = async () => {
            const sourceYear = (parseInt(selectedYear) - 1).toString();
            if (!confirm(`確定要將「${sourceYear} 年度」的設定與評審名單，複製到「${selectedYear} 年度」嗎？`)) return;
            
            setIsCopying(true);
            try {
                const payload = {
                    action: 'copyYearData',
                    API_Key: API_KEY,
                    sourceYear: sourceYear,
                    targetYear: selectedYear
                };
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert(`已成功建立 ${selectedYear} 年度的設定檔！`);
                    fetchSystemConfig();
                    fetchJudges();
                } else {
                    alert("複製失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("執行複製時發生錯誤");
            } finally {
                setIsCopying(false);
            }
        };

        // ================= 4. 左半部處理邏輯 (Config) =================
        const handleConfigChange = (e) => {
            const { name, value, type, checked } = e.target;
            setConfig(prev => ({
                ...prev,
                [name]: type === 'checkbox' ? checked : value
            }));
        };

        const handleAddCategory = () => {
            const cat = newCategory.trim();
            if (cat && !flatCategories.includes(cat)) {
                setConfig(prev => {
                    const newCats = { ...(prev.categories || {}) };
                    if (!newCats["未分類"]) newCats["未分類"] = [];
                    newCats["未分類"] = [...newCats["未分類"], cat];
                    return { ...prev, categories: newCats };
                });
                setNewCategory('');
            }
        };

        const handleRemoveCategory = (catToRemove) => {
            setConfig(prev => {
                const newCats = { ...prev.categories };
                Object.keys(newCats).forEach(key => {
                    newCats[key] = newCats[key].filter(c => c !== catToRemove);
                });
                return { ...prev, categories: newCats };
            });
        };

        const saveSystemConfig = async () => {
            setIsConfigSaving(true);
            try {
                // 準備雙重相容的 Payload，確保後端不管用哪個 Key 都接得到
                const catString = JSON.stringify(config.categories || {});
                const payload = { 
                    action: 'saveSystemConfig', 
                    API_Key: API_KEY, 
                    year: selectedYear, 
                    
                    // 前端慣用 Key
                    current_year: config.current_year,
                    is_registration_open: config.is_registration_open,
                    is_judging_open: config.is_judging_open,
                    categories: catString,
                    
                    // 後端資料庫對應 Key (保險起見一併傳送)
                    Competition_Year: config.current_year,
                    Is_Active: config.is_registration_open,
                    System_Lock: !config.is_judging_open,
                    Category_Group_Map: catString
                };
                
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === 'success') {
                    alert("系統設定已儲存！");
                    setHasConfig(true); 
                } else {
                    alert("儲存設定失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("儲存設定時發生錯誤");
            } finally {
                setIsConfigSaving(false);
            }
        };

        // ================= 5. 右半部處理邏輯 (Judge) =================
        const openJudgeModal = (mode, judge = null) => {
            setJudgeModalMode(mode);
            if (mode === 'edit' && judge) {
                setJudgeFormData({
                    Competition_Year: judge.competition_year || judge.Competition_Year || selectedYear,
                    Judge_Code: judge.judge_code || judge.Judge_Code || '',
                    Judge_Name: judge.judge_name || judge.Judge_Name || '',
                    Password: judge.password || judge.Password || '',
                    Categories: Array.isArray(judge.categories) ? judge.categories : []
                });
            } else {
                setJudgeFormData({
                    Competition_Year: selectedYear,
                    Judge_Code: '',
                    Judge_Name: '',
                    Password: '',
                    Categories: []
                });
            }
            setIsJudgeModalOpen(true);
        };

        const handleJudgeFormChange = (e) => {
            const { name, value } = e.target;
            setJudgeFormData(prev => ({ ...prev, [name]: value }));
        };

        const handleJudgeCategoryToggle = (category) => {
            setJudgeFormData(prev => {
                const cats = prev.Categories || [];
                if (cats.includes(category)) return { ...prev, Categories: cats.filter(c => c !== category) };
                else return { ...prev, Categories: [...cats, category] };
            });
        };

        const saveJudge = async () => {
            if (!judgeFormData.Judge_Code || !judgeFormData.Judge_Name) {
                alert("代碼與姓名為必填欄位！");
                return;
            }
            setIsJudgeSaving(true);
            try {
                const payload = { action: 'saveJudge', API_Key: API_KEY, ...judgeFormData };
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === 'success') {
                    setIsJudgeModalOpen(false);
                    fetchJudges();
                } else alert("儲存評審失敗：" + result.message);
            } catch (err) {
                console.error(err);
                alert("儲存評審發生錯誤");
            } finally {
                setIsJudgeSaving(false);
            }
        };

        const deleteJudge = async (judgeCode, judgeName) => {
            if (!confirm(`確定要刪除評審「${judgeName}」嗎？`)) return;
            setIsJudgesLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'deleteJudge', API_Key: API_KEY, Judge_Code: judgeCode, year: selectedYear })
                });
                const result = await response.json();
                if (result.status === 'success') fetchJudges();
                else alert("刪除失敗：" + result.message);
            } catch (err) {
                console.error(err);
                alert("刪除發生錯誤");
            } finally {
                setIsJudgesLoading(false);
            }
        };

        // ================= UI 渲染 =================
        
        if (!hasConfig && !isConfigLoading) {
            return (
                <div className="mt-12 flex justify-center">
                    <div className="bg-white p-10 rounded-xl shadow-lg border border-gray-200 text-center max-w-md w-full">
                        <span className="material-icons text-gray-300 text-6xl mb-4">folder_off</span>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">尚未建立設定</h2>
                        <p className="text-gray-600 mb-8">
                            目前尚無 <span className="font-bold text-indigo-600 text-lg">{selectedYear}</span> 年度的系統設定與評審名單。
                        </p>
                        
                        <button 
                            onClick={handleCopyYearData}
                            disabled={isCopying}
                            className={`w-full flex items-center justify-center py-3 px-4 rounded-lg shadow-md text-white font-bold transition-all
                                ${isCopying ? 'bg-indigo-300 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 hover:shadow-lg transform hover:-translate-y-0.5'}
                            `}
                        >
                            {isCopying ? (
                                <>
                                    <span className="material-icons animate-spin mr-2">autorenew</span>
                                    正在複製建立中...
                                </>
                            ) : (
                                <>
                                    <span className="material-icons mr-2">content_copy</span>
                                    一鍵建立 (複製上一年度)
                                </>
                            )}
                        </button>
                        
                        <div className="mt-6 flex items-center justify-center">
                            <span className="text-xs text-gray-400 border-b border-gray-300 w-1/4"></span>
                            <span className="text-xs text-gray-400 mx-2">或</span>
                            <span className="text-xs text-gray-400 border-b border-gray-300 w-1/4"></span>
                        </div>
                        
                        <button 
                            onClick={() => setHasConfig(true)}
                            className="mt-4 text-sm text-gray-500 hover:text-indigo-600 underline transition-colors"
                        >
                            手動從零開始設定
                        </button>
                    </div>
                </div>
            );
        }

        return (
            <div className="mt-6">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <span className="material-icons text-primary">settings</span>
                        系統設定與評審管理 <span className="text-sm font-normal text-gray-500 ml-2">({selectedYear} 年度)</span>
                    </h2>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* 左半部：全域參數設定 */}
                    <div className="bg-white rounded-lg shadow-md border border-gray-200 flex flex-col">
                        <div className="bg-gray-50 px-6 py-4 border-b border-gray-200">
                            <h3 className="text-lg font-bold text-gray-800 flex items-center">

                                全域參數設定

                        </div>

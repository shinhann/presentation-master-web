<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報達人擂台賽評分系統 (Dev)</title>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(message);
        };
    </script>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3E2723',
                        secondary: '#D84315',
                    }
                }
            }
        }
    </script>

    <!-- React 核心 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F5F5F5; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel">
    if (typeof React === 'undefined') {
        alert("錯誤：React 無法載入，請檢查網路。");
    }

    const { useState, useEffect } = React;

    // ================= CONFIG 設定區 =================

    // 1. Google Apps Script 部署網址 (後端 API)
    const API_URL = "https://script.google.com/macros/s/AKfycbwLRsiyHMiQzqyk52CBkmnASqJUznH3JWW50rzKNRNAuRGY5Ci8-IQNKxOOnxE99vLq/exec";
    
    // 2. API Key
    const API_KEY = "TEST_KEY_123"; 

    // 3. 全域組別定義 (Global Constants)
    const ALL_CATEGORIES = [
      "宜蘭在地國中組", "宜蘭在地國小組",
      "環境永續國中組", "環境永續國小組",
      "校訂課程國中組", "校訂課程國小組"
    ];

    // =================================================================

    // --- 登入頁面元件 (Login) ---
    const Login = ({ onLoginSuccess }) => {
        const [userType, setUserType] = useState('judge');
        const [formData, setFormData] = useState({ id: '', password: '' });
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        
        const [judgeList, setJudgeList] = useState([]);
        const [isListLoading, setIsListLoading] = useState(false);

        useEffect(() => {
            if (userType === 'judge') {
                fetchJudgeList();
            }
        }, [userType]);

        const fetchJudgeList = async () => {
            setIsListLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getJudgeList',
                        API_Key: API_KEY
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    setJudgeList(result.data);
                } else {
                    console.warn("無法載入評審名單:", result.message);
                }
            } catch (err) {
                console.error("無法載入評審名單", err);
                setError("無法連接伺服器讀取評審名單");
            } finally {
                setIsListLoading(false);
            }
        };

        const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
            if (error) setError('');
        };

        const handleUserTypeChange = (e) => {
            setUserType(e.target.value);
            setFormData({ id: '', password: '' });
            setError('');
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');

            if (userType === 'judge' && !formData.id) {
                setError('請選擇評審姓名');
                setLoading(false);
                return;
            }
            if (!formData.password) {
                setError('請輸入密碼');
                setLoading(false);
                return;
            }

            try {
                const payload = {
                    action: 'login',
                    API_Key: API_KEY, 
                    user_type: userType,
                    id: userType === 'judge' ? formData.id : '', 
                    password: formData.password
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    const userData = { ...result.data, role: userType === 'admin' ? 'admin' : 'judge' };
                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    onLoginSuccess(userData);
                } else {
                    setError(result.message || '登入失敗，請檢查帳號密碼。');
                }

            } catch (err) {
                console.error('Login Error:', err);
                setError('無法連接伺服器，請檢查網路或 API 網址。');
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-primary">
                    <div className="text-center mb-8">
                        <h1 className="text-2xl font-bold text-primary mb-2">114學年度 簡報達人擂台賽</h1>
                        <p className="text-gray-500 font-medium">評審評分系統</p>
                    </div>
                    {error && (
                        <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-200 flex items-center">
                            <span className="material-icons text-sm mr-2">error</span>
                            {error}
                        </div>
                    )}
                    <form onSubmit={handleLogin} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">登入身分</label>
                            <div className="relative">
                                <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">badge</span>
                                <select 
                                    value={userType}
                                    onChange={handleUserTypeChange}
                                    className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                >
                                    <option value="judge">評審委員 (Judge)</option>
                                    <option value="admin">系統管理員 (Admin)</option>
                                </select>
                            </div>
                        </div>
                        {userType === 'judge' && (
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    評審姓名
                                    {isListLoading && <span className="text-xs text-gray-400 ml-2">(資料載入中...)</span>}
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">person</span>
                                    <select 
                                        name="id" 
                                        value={formData.id} 
                                        onChange={handleChange} 
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                        disabled={isListLoading}
                                    >
                                        <option value="">{isListLoading ? "讀取中..." : "請選擇您的姓名..."}</option>
                                        {judgeList.length > 0 ? (
                                            judgeList.map((judge) => (
                                                <option key={judge.id} value={judge.id}>{judge.name}</option>
                                            ))
                                        ) : (
                                            !isListLoading && <option value="" disabled>無可用名單</option>
                                        )}
                                    </select>
                                </div>
                            </div>
                        )}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                {userType === 'admin' ? '管理員密碼' : '登入密碼'}
                            </label>
                            <div className="relative">
                                <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">lock</span>
                                <input
                                    type="password"
                                    name="password"
                                    value={formData.password}
                                    onChange={handleChange}
                                    placeholder="請輸入密碼"
                                    className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary"
                                />
                            </div>
                        </div>
                        <button 
                            type="submit"
                            disabled={loading}
                            className={`w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors
                                ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                            `}
                        >
                            {loading ? "登入驗證中..." : "登入系統"}
                        </button>
                    </form>
                </div>
            </div>
        );
    };

    // --- 核心功能：評審管理元件 (JudgeManager) ---jan 24 20:21 update
    const JudgeManager = () => {
        const [judges, setJudges] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        // Modal 狀態
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [modalMode, setModalMode] = useState('add'); // 'add' | 'edit'
        const [isSaving, setIsSaving] = useState(false);
        
        // 表單狀態
        const [formData, setFormData] = useState({
            id: '',
            name: '',
            password: '',
            categories: [], // Array
            year: '' // 用來記錄編輯時的年份，供內部參考
        });

        // 1. 讀取評審資料 (Read & Sort)
        const fetchJudges = async () => {
            setIsLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getAllJudges',
                        API_Key: API_KEY
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    // 資料排序：年度降序 (最新的在上面)
                    const sortedData = result.data.sort((a, b) => {
                        const yearA = a.competition_year || a.year || 0;
                        const yearB = b.competition_year || b.year || 0;
                        return yearB - yearA; 
                    });
                    setJudges(sortedData);
                    console.log('Judges Loaded:', sortedData);
                } else {
                    alert("讀取失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("連線錯誤，無法讀取評審列表");
            } finally {
                setIsLoading(false);
            }
        };

        useEffect(() => {
            fetchJudges();
        }, []);

        // 2. 刪除資料 (Delete)
        const handleDelete = async (judge) => {
            const judgeName = judge.judge_name || judge.name;
            const confirmDelete = window.confirm(`確定要刪除評審「${judgeName}」嗎？\n此動作無法復原。`);
            
            if (!confirmDelete) return;

            // 取得正確的識別參數
            const targetCode = judge.judge_code || judge.id;
            const targetYear = judge.competition_year || judge.year;

            setIsLoading(true); // 顯示全域 Loading
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteJudge',
                        API_Key: API_KEY,
                        judge_code: targetCode,
                        competition_year: targetYear
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('刪除成功');
                    fetchJudges(); // 重新整理列表
                } else {
                    alert('刪除失敗：' + result.message);
                    setIsLoading(false);
                }
            } catch (err) {
                console.error(err);
                alert('刪除時發生錯誤');
                setIsLoading(false);
            }
        };

        // 3. 開啟 Modal (新增/編輯)
        const openModal = (mode, judge = null) => {
            setModalMode(mode);
            if (mode === 'edit' && judge) {
                setFormData({
                    id: judge.judge_code || judge.id,
                    name: judge.judge_name || judge.name,
                    password: judge.password || '', 
                    categories: Array.isArray(judge.categories) ? judge.categories : [],
                    year: judge.competition_year || judge.year // 保留年份資料
                });
            } else {
                setFormData({ id: '', name: '', password: '', categories: [], year: '' });
            }
            setIsModalOpen(true);
        };

        // 4. 表單欄位變更
        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        // 5. Checkbox 勾選邏輯
        const handleCategoryToggle = (category) => {
            setFormData(prev => {
                const currentCats = prev.categories || [];
                if (currentCats.includes(category)) {
                    return { ...prev, categories: currentCats.filter(c => c !== category) };
                } else {
                    return { ...prev, categories: [...currentCats, category] };
                }
            });
        };

        // 6. 儲存資料 (Save)
        const handleSave = async () => {
            if (!formData.id || !formData.name || !formData.password) {
                alert("代碼、姓名與密碼為必填欄位！");
                return;
            }

            setIsSaving(true);
            try {
                const payload = {
                    action: 'saveJudge',
                    API_Key: API_KEY,
                    judge_code: formData.id,
                    judge_name: formData.name,
                    password: formData.password,
                    categories: formData.categories // Array
                    // 注意：這裡我們不傳 competition_year，交由後端處理 (新增時為今年，編輯時後端應保留原年份或更新)
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    setIsModalOpen(false);
                    fetchJudges(); 
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("連線錯誤，無法儲存");
            } finally {
                setIsSaving(false);
            }
        };

        return (
            <div className="bg-white rounded shadow-md p-6">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-gray-800 flex items-center">
                        <span className="material-icons mr-2 text-primary">manage_accounts</span>
                        評審帳號管理
                    </h2>
                    <button 
                        onClick={() => openModal('add')}
                        className="bg-secondary hover:bg-orange-700 text-white px-4 py-2 rounded shadow flex items-center transition"
                    >
                        <span className="material-icons text-sm mr-1">add</span>
                        新增評審
                    </button>
                </div>

                {/* Table 顯示區 */}
                <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-gray-200 border">
                        <thead className="bg-gray-50">
                            <tr>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年度</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">代碼</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">負責組別</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">密碼</th>
                                <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                            {isLoading ? (
                                <tr><td colSpan="6" className="px-6 py-4 text-center text-gray-500">載入中...</td></tr>
                            ) : judges.length === 0 ? (
                                <tr><td colSpan="6" className="px-6 py-4 text-center text-gray-500">目前沒有評審資料</td></tr>
                            ) : (
                                judges.map((judge, index) => {
                                    // 欄位 fallback 處理
                                    const displayYear = judge.competition_year || judge.year || '-';
                                    const displayId = judge.judge_code || judge.id || 'N/A';
                                    const displayName = judge.judge_name || judge.name || '未命名';
                                    
                                    return (
                                        <tr key={displayId + index} className="hover:bg-gray-50">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{displayYear}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900">{displayId}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{displayName}</td>
                                            <td className="px-6 py-4 text-sm text-gray-600">
                                                {judge.categories && judge.categories.length > 0 
                                                    ? judge.categories.join('、') 
                                                    : <span className="text-gray-400">未指定</span>
                                                }
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-400">******</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                <div className="flex justify-end space-x-3">
                                                    <button 
                                                        onClick={() => openModal('edit', judge)}
                                                        className="text-blue-600 hover:text-blue-900 flex items-center"
                                                        title="編輯"
                                                    >
                                                        <span className="material-icons text-lg">edit</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDelete(judge)}
                                                        className="text-red-600 hover:text-red-900 flex items-center"
                                                        title="刪除"
                                                    >
                                                        <span className="material-icons text-lg">delete</span>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })
                            )}
                        </tbody>
                    </table>
                </div>

                {/* Modal 視窗 */}
                {isModalOpen && (
                    <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                        <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                            {/* 背景遮罩 */}
                            <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onClick={() => setIsModalOpen(false)}></div>
                            <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                            
                            <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                                <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                    <h3 className="text-lg leading-6 font-medium text-gray-900 mb-4">
                                        {modalMode === 'add' ? '新增評審' : '編輯評審資料'}
                                    </h3>
                                    <div className="space-y-4">
                                        {/* ID */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">代碼 (ID)</label>
                                            <input 
                                                type="text" 
                                                name="id"
                                                value={formData.id}
                                                onChange={handleInputChange}
                                                disabled={modalMode === 'edit'} 
                                                className={`mt-1 block w-full border rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm 
                                                    ${modalMode === 'edit' ? 'bg-gray-100 text-gray-500 border-gray-300' : 'border-gray-300'}
                                                `}
                                                placeholder="例如：J01"
                                            />
                                        </div>
                                        {/* Name */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">姓名</label>
                                            <input 
                                                type="text" 
                                                name="name"
                                                value={formData.name}
                                                onChange={handleInputChange}
                                                className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                placeholder="評審真實姓名"
                                            />
                                        </div>
                                        {/* Password */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700">密碼</label>
                                            <input 
                                                type="text" 
                                                name="password"
                                                value={formData.password}
                                                onChange={handleInputChange}
                                                className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                placeholder="登入密碼"
                                            />
                                        </div>
                                        {/* Categories (Checkbox Group) */}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">負責組別 (多選)</label>
                                            <div className="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded border border-gray-200 max-h-48 overflow-y-auto">
                                                {ALL_CATEGORIES.map(cat => (
                                                    <label key={cat} className="flex items-center space-x-2 cursor-pointer p-1 hover:bg-gray-100 rounded">
                                                        <input 
                                                            type="checkbox"
                                                            className="form-checkbox text-secondary h-4 w-4"
                                                            checked={formData.categories.includes(cat)}
                                                            onChange={() => handleCategoryToggle(cat)}
                                                        />
                                                        <span className="text-sm text-gray-700">{cat}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                                    <button 
                                        type="button" 
                                        onClick={handleSave}
                                        disabled={isSaving}
                                        className={`w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white sm:ml-3 sm:w-auto sm:text-sm
                                            ${isSaving ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                                        `}
                                    >
                                        {isSaving ? '儲存中...' : '儲存'}
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setIsModalOpen(false)}
                                        className="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm"
                                    >
                                        取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

// --- 隊伍資源管理元件 (TeamManager) ---
    const TeamManager = () => {
        const [teams, setTeams] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        
        // Modal 相關狀態
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [modalMode, setModalMode] = useState('add');
        const [activeModalTab, setActiveModalTab] = useState('basic'); // basic, personnel, contact, resources
        const [isSaving, setIsSaving] = useState(false);

        // 初始表單狀態
        const initialFormState = {
            team_id: '',
            basic: {
                year: new Date().getFullYear() - 1911,
                category: ALL_CATEGORIES[0],
                school: '',
                group_name: '',
                work_title: '',
                description: '',
                memo: ''
            },
            students: [
                { name: '', email: '' },
                { name: '', email: '' },
                { name: '', email: '' }
            ],
            teachers: [
                { name: '', email: '' },
                { name: '', email: '' }
            ],
            contact: { name: '', phone: '' },

                mindmap: '',

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getAllTeams', API_Key: API_KEY })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    // ★ 除錯：印出第一筆資料，檢查欄位名稱 (按 F12 看 Console)
                    if (result.data && result.data.length > 0) {
                        console.log('第一筆隊伍資料 (Debug):', result.data[0]);
                    }

                    // 依照 category 排序
                    const sorted = result.data.sort((a, b) => {
                        return (a.category || '').localeCompare(b.category || '');
                    });
                    setTeams(sorted);
                } else {
                    console.warn("讀取失敗:", result.message);
                }
            } catch (err) {
                console.error("Fetch Teams Error:", err);
                alert("無法讀取隊伍資料");
            } finally {
                setIsLoading(false);
            }
        };

            fetchTeams();

        const handleBasicChange = (e) => {

            setFormData(prev => ({ ...prev, basic: { ...prev.basic, [name]: value } }));
        };

        const handleArrayChange = (type, index, field, value) => {
            setFormData(prev => {
                const newArray = [...prev[type]]; 
                newArray[index] = { ...newArray[index], [field]: value };
                return { ...prev, [type]: newArray };
            });
        };

        const handleContactChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, contact: { ...prev.contact, [name]: value } }));
        };

        const handleLinkChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, links: { ...prev.links, [name]: value } }));
        };

        const quickImportContact = (teacherIndex) => {
            const teacher = formData.teachers[teacherIndex];
            if (teacher && teacher.name) {
                setFormData(prev => ({
                    ...prev,
                    contact: { ...prev.contact, name: teacher.name }
                }));

                alert("該指導老師姓名為空，無法帶入。");
            }
        };

        // 3. 開啟 Modal
        const openModal = (mode, team = null) => {
            setModalMode(mode);
            setActiveModalTab('basic');

            if (mode === 'edit' && team) {
                setFormData({
                    team_id: team.team_id || team.id || '',
                    basic: {
                        // ★ 這裡也加上讀取容錯，確保編輯時年份能帶入
                        year: team.basic?.year || team.Competition_Year || team.year || (new Date().getFullYear() - 1911),
                        category: team.basic?.category || team.category || ALL_CATEGORIES[0],
                        school: team.basic?.school || team.school || '',
                        group_name: team.basic?.group_name || team.group_name || '',
                        work_title: team.basic?.work_title || team.work_title || '',
                        description: team.basic?.description || team.description || '',
                        memo: team.basic?.memo || team.memo || ''
                    },
                    students: [0, 1, 2].map(i => ({
                        name: team.students?.[i]?.name || team[`student${i+1}_name`] || '',
                        email: team.students?.[i]?.email || team[`student${i+1}_email`] || ''
                    })),
                    teachers: [0, 1].map(i => ({
                        name: team.teachers?.[i]?.name || team[`teacher${i+1}_name`] || '',
                        email: team.teachers?.[i]?.email || team[`teacher${i+1}_email`] || ''
                    })),
                    contact: {
                        name: team.contact?.name || team.contact_name || '',
                        phone: team.contact?.phone || team.contact_phone || ''
                    },
                    links: {
                        mindmap: team.links?.mindmap || team.link_mindmap || '',
                        slides: team.links?.slides || team.link_slides || '',
                        video: team.links?.video || team.link_video || '',
                        consent: team.links?.consent || team.link_consent || '',
                        drive: team.links?.drive || team.link_drive || '',
                        link_note: team.links?.link_note || team.link_note || ''

                setFormData(initialFormState);
            }
            setIsModalOpen(true);
        };

                return;
            }

            setIsSaving(true);
            try {
                const payload = {
                    action: 'saveTeam',
                    API_Key: API_KEY,
                    ...formData 
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    setIsModalOpen(false);
                    fetchTeams();
                } else {
                    alert("儲存失敗: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("儲存錯誤");
            } finally {
                setIsSaving(false);
            }
        };

        // 5. 刪除
        const handleDelete = async (teamId, teamName) => {

            setIsLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteTeam',
                        API_Key: API_KEY,
                        team_id: teamId
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert("刪除成功");
                    fetchTeams();
                } else {
                    alert("刪除失敗: " + result.message);
                }

                console.error(err);
                alert("刪除錯誤");

{/* Table List */}

                                                    <span className="material-icons text-base">edit</span>

                                    </button>

                                        {[

                                            { id: 'personnel', label: '人員編制' },
                                            { id: 'contact', label: '聯絡窗口' },
                                            { id: 'resources', label: '資源與備註' }

            <div className="min-h-screen bg-gray-100 pb-10">
                {/* Top Navbar */}
                <nav className="bg-primary shadow-lg sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center">
                                <span className="material-icons text-white mr-2">admin_panel_settings</span>
                                <span className="font-bold text-xl text-white">管理員後台</span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="text-gray-200 text-sm hidden sm:block">Hello, Admin</span>
                                <button 
                                    onClick={onLogout}
                                    className="bg-gray-800 text-gray-300 hover:text-white px-3 py-1 rounded text-sm transition flex items-center"
                                >
                                    <span className="material-icons text-sm mr-1">logout</span>
                                    登出
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>

                {/* Main Content Area */}
                <main className="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                    
                    {/* Page Title & Tabs */}
                    <div className="mb-6">
                        <div className="sm:hidden">
                            <select 
                                value={currentTab} 
                                onChange={(e) => setCurrentTab(e.target.value)}
                                className="block w-full rounded-md border-gray-300 focus:border-secondary focus:ring-secondary"
                            >
                                <option value="teams">隊伍管理 (Teams)</option>
                                <option value="judges">評審設定 (Judges)</option>
                            </select>
                        </div>
                        <div className="hidden sm:block">
                            <div className="border-b border-gray-200">
                                <nav className="-mb-px flex space-x-8" aria-label="Tabs">
                                    <button
                                        onClick={() => setCurrentTab('teams')}
                                        className={`
                                            ${currentTab === 'teams'
                                                ? 'border-secondary text-secondary'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }
                                            whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center
                                        `}
                                    >
                                        <span className="material-icons mr-2 text-base">groups</span>
                                        隊伍資源管理
                                    </button>

                                    <button
                                        onClick={() => setCurrentTab('judges')}
                                        className={`
                                            ${currentTab === 'judges'
                                                ? 'border-secondary text-secondary'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }
                                            whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center
                                        `}
                                    >
                                        <span className="material-icons mr-2 text-base">manage_accounts</span>
                                        評審帳號設定
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </div>

                    {/* Conditional Rendering */}
                    <div className="transition-opacity duration-300">
                        {currentTab === 'teams' ? (
                            <TeamManager />
                        ) : (
                            <JudgeManager />
                        )}
                    </div>

                </main>
            </div>
        );
    };

    // --- 主程式 App ---
    const App = () => {
        const [user, setUser] = useState(null);

        useEffect(() => {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    setUser(JSON.parse(storedUser));
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        }, []);

        const handleLogout = () => {
            localStorage.removeItem('currentUser');
            setUser(null);
        };

        // 根據 user.role 路由
        const renderContent = () => {
            if (!user) {
                return <Login onLoginSuccess={setUser} />;
            }

            // 若是管理員 -> AdminDashboard
            if (user.role === 'admin') {
                return <AdminDashboard user={user} onLogout={handleLogout} />;
            }

            // 若是評審 -> 原本的歡迎畫面 (之後會開發評審儀表板)
            return (
                <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
                    <div className="bg-white p-8 rounded shadow text-center border-t-4 border-secondary">
                        <h2 className="text-2xl font-bold text-primary mb-4">歡迎回來！</h2>
                        <p className="text-lg mb-2 font-medium">{user.judge_name} 老師</p>
                        <div className="bg-orange-50 p-4 rounded mb-6 text-left">
                            <p className="text-sm text-gray-500 mb-1">您負責的評分組別：</p>
                            <div className="flex flex-wrap gap-2">
                                {user.category ? (
                                    // 假設這裡後端回傳的是字串，先 split 處理，若已是陣列則直接用
                                    (Array.isArray(user.category) ? user.category : user.category.split(',')).map(c => (
                                        <span key={c} className="bg-white border border-secondary text-secondary px-2 py-1 rounded text-sm">
                                            {c}
                                        </span>
                                    ))
                                ) : (
                                    <span className="text-gray-400">尚未分配</span>
                                )}
                            </div>
                        </div>
                        <button 
                            onClick={handleLogout}
                            className="px-6 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
                        >
                            登出系統
                        </button>
                    </div>
                </div>
            );
        };

        return (
            <React.StrictMode>
                {renderContent()}
            </React.StrictMode>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報達人擂台賽評分系統 (Dev)</title>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(message);
        };
    </script>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3E2723',
                        secondary: '#D84315',
                    }
                }
            }
        }
    </script>

    <!-- React 核心 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F5F5F5; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel">
        if (typeof React === 'undefined') {
            alert("錯誤：React 無法載入，請檢查網路。");
        }

        const { useState, useEffect } = React;

        // ================= CONFIG 設定區 =================

        // 1. Google Apps Script 部署網址 (後端 API)
        const API_URL = "https://script.google.com/macros/s/AKfycbwLRsiyHMiQzqyk52CBkmnASqJUznH3JWW50rzKNRNAuRGY5Ci8-IQNKxOOnxE99vLq/exec";
        
        // 2. API Key
        const API_KEY = "TEST_KEY_123"; 

        // 3. 全域組別定義
        const ALL_CATEGORIES = [
          "宜蘭在地國中組", "宜蘭在地國小組",
          "環境永續國中組", "環境永續國小組",
          "校訂課程國中組", "校訂課程國小組"
        ];

        // =================================================================

        // --- 登入頁面元件 (Login) ---
        const Login = ({ onLoginSuccess }) => {
            const [userType, setUserType] = useState('judge');
            const [formData, setFormData] = useState({ id: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            // 評審名單狀態 (從 API 抓取)
            const [judgeList, setJudgeList] = useState([]);
            const [isListLoading, setIsListLoading] = useState(false);

            // 當切換到評審身分時，呼叫後端 API 抓名單
            useEffect(() => {
                if (userType === 'judge') {
                    fetchJudgeList();
                }
            }, [userType]);

            const fetchJudgeList = async () => {
                setIsListLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getJudgeList',
                            API_Key: API_KEY
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setJudgeList(result.data);
                    } else {
                        console.warn("無法載入評審名單:", result.message);
                    }
                } catch (err) {
                    console.error("無法載入評審名單", err);
                    setError("無法連接伺服器讀取評審名單");
                } finally {
                    setIsListLoading(false);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (error) setError('');
            };

            const handleUserTypeChange = (e) => {
                setUserType(e.target.value);
                setFormData({ id: '', password: '' });
                setError('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                if (userType === 'judge' && !formData.id) {
                    setError('請選擇評審姓名');
                    setLoading(false);
                    return;
                }
                if (!formData.password) {
                    setError('請輸入密碼');
                    setLoading(false);
                    return;
                }

                try {
                    const payload = {
                        action: 'login',
                        API_Key: API_KEY, 
                        user_type: userType,
                        id: userType === 'judge' ? formData.id : '', 
                        password: formData.password
                    };

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        // 儲存使用者資訊
                        const userData = { ...result.data, role: userType === 'admin' ? 'admin' : 'judge' };
                        localStorage.setItem('currentUser', JSON.stringify(userData));
                        onLoginSuccess(userData);
                    } else {
                        setError(result.message || '登入失敗，請檢查帳號密碼。');
                    }

                } catch (err) {
                    console.error('Login Error:', err);
                    setError('無法連接伺服器，請檢查網路或 API 網址。');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-primary">
                        
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-bold text-primary mb-2">
                                114學年度 簡報達人擂台賽
                            </h1>
                            <p className="text-gray-500 font-medium">評審評分系統</p>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-200 flex items-center">
                                <span className="material-icons text-sm mr-2">error</span>
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-6">
                            
                            {/* 身分選擇 */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    登入身分
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">badge</span>
                                    <select 
                                        value={userType}
                                        onChange={handleUserTypeChange}
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                    >
                                        <option value="judge">評審委員 (Judge)</option>
                                        <option value="admin">系統管理員 (Admin)</option>
                                    </select>
                                </div>
                            </div>

                            {/* 動態評審姓名選單 */}
                            {userType === 'judge' && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        評審姓名
                                        {isListLoading && <span className="text-xs text-gray-400 ml-2">(資料載入中...)</span>}
                                    </label>
                                    <div className="relative">
                                        <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">person</span>
                                        <select 
                                            name="id" 
                                            value={formData.id} 
                                            onChange={handleChange} 
                                            className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                            disabled={isListLoading}
                                        >
                                            <option value="">
                                                {isListLoading ? "讀取中..." : "請選擇您的姓名..."}
                                            </option>
                                            
                                            {judgeList.length > 0 ? (
                                                judgeList.map((judge) => (
                                                    <option key={judge.id} value={judge.id}>
                                                        {judge.name}
                                                    </option>
                                                ))
                                            ) : (
                                                !isListLoading && <option value="" disabled>無可用名單</option>
                                            )}
                                        </select>
                                    </div>
                                </div>
                            )}

                            {/* 密碼輸入 */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    {userType === 'admin' ? '管理員密碼' : '登入密碼'}
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">lock</span>
                                    <input
                                        type="password"
                                        name="password"
                                        value={formData.password}
                                        onChange={handleChange}
                                        placeholder="請輸入密碼"
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary"
                                    />
                                </div>
                            </div>

                            {/* 按鈕 */}
                            <button 
                                type="submit"
                                disabled={loading}
                                className={`w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors
                                    ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                                `}
                            >
                                {loading ? "登入驗證中..." : "登入系統"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 評審管理元件 (JudgeManager) ---
        const JudgeManager = () => {
            const [judges, setJudges] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);

            // Modal 相關狀態
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [modalMode, setModalMode] = useState('add'); // 'add' or 'edit'
            
            // 表單資料狀態
            const [formData, setFormData] = useState({
                id: '',
                name: '',
                password: '',
                categories: []
            });

            // 載入評審列表
            const fetchJudges = async () => {
                setIsLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getAllJudges',
                            API_Key: API_KEY
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setJudges(result.data);
                    } else {
                        throw new Error(result.message);
                    }
                } catch (err) {
                    console.error("Fetch Judges Error:", err);
                    setError("無法載入評審資料");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchJudges();
            }, []);

            // 開啟新增視窗
            const handleAddClick = () => {
                setModalMode('add');
                setFormData({ id: '', name: '', password: '', categories: [] });
                setIsModalOpen(true);
            };

            // 開啟編輯視窗
            const handleEditClick = (judge) => {
                setModalMode('edit');
                setFormData({
                    id: judge.id,
                    name: judge.name,
                    password: judge.password || '', // 若 API 沒回傳密碼，預設空字串
                    categories: Array.isArray(judge.categories) ? judge.categories : []
                });
                setIsModalOpen(true);
            };

            // 處理表單輸入
            const handleFormChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            // 處理組別勾選邏輯
            const handleCategoryToggle = (category) => {
                setFormData(prev => {
                    const currentCats = prev.categories || [];
                    if (currentCats.includes(category)) {
                        return { ...prev, categories: currentCats.filter(c => c !== category) };
                    } else {
                        return { ...prev, categories: [...currentCats, category] };
                    }
                });
            };

            // 儲存評審 (新增或編輯)
            const handleSave = async () => {
                if (!formData.id || !formData.name || !formData.password) {
                    alert("請填寫所有必要欄位 (代碼、姓名、密碼)");
                    return;
                }

                setIsSaving(true);
                try {
                    const payload = {
                        action: 'saveJudge',
                        API_Key: API_KEY,
                        judge_code: formData.id,
                        judge_name: formData.name,
                        password: formData.password,
                        categories: formData.categories
                    };

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        setIsModalOpen(false);
                        fetchJudges(); // 重新整理列表
                    } else {
                        alert("儲存失敗: " + result.message);
                    }
                } catch (err) {
                    console.error("Save Judge Error:", err);
                    alert("連線發生錯誤，無法儲存");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800 flex items-center">
                            <span className="material-icons mr-2 text-primary">manage_accounts</span>
                            評審名單設定
                        </h2>
                        <button 
                            onClick={handleAddClick}
                            className="bg-secondary text-white px-4 py-2 rounded shadow hover:bg-orange-700 flex items-center"
                        >
                            <span className="material-icons text-sm mr-1">add</span>
                            新增評審
                        </button>
                    </div>

                    {/* 列表 Table */}
                    <div className="overflow-x-auto">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">代碼 (ID)</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">負責組別</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">密碼</th>
                                    <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {isLoading ? (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-4 text-center text-gray-500">
                                            載入中...
                                        </td>
                                    </tr>
                                ) : judges.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-4 text-center text-gray-500">
                                            目前沒有評審資料
                                        </td>
                                    </tr>
                                ) : (
                                    judges.map((judge) => (
                                        <tr key={judge.id} className="hover:bg-gray-50">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900">{judge.id}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{judge.name}</td>
                                            <td className="px-6 py-4 text-sm text-gray-500">
                                                {judge.categories && judge.categories.length > 0 ? (
                                                    <div className="flex flex-wrap gap-1">
                                                        {judge.categories.map(cat => (
                                                            <span key={cat} className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">
                                                                {cat}
                                                            </span>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <span className="text-gray-400">未指定</span>
                                                )}
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-400">******</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                <button 
                                                    onClick={() => handleEditClick(judge)}
                                                    className="text-primary hover:text-indigo-900 flex items-center ml-auto"
                                                >
                                                    <span className="material-icons text-base mr-1">edit</span>
                                                    編輯
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* 編輯/新增 Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                            {/* 背景遮罩 */}
                            <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                                <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onClick={() => setIsModalOpen(false)}></div>
                                <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                                
                                {/* Modal 內容 */}
                                <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                                    <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                        <div className="sm:flex sm:items-start">
                                            <div className="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                                                <h3 className="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                                    {modalMode === 'add' ? '新增評審帳號' : '編輯評審資料'}
                                                </h3>
                                                <div className="mt-4 space-y-4">
                                                    {/* ID 欄位 */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700">代碼 (ID)</label>
                                                        <input 
                                                            type="text" 
                                                            name="id"
                                                            value={formData.id}
                                                            onChange={handleFormChange}
                                                            disabled={modalMode === 'edit'} // 編輯時 ID 不可改
                                                            className={`mt-1 block w-full border rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm
                                                                ${modalMode === 'edit' ? 'bg-gray-100 border-gray-300 text-gray-500' : 'border-gray-300'}
                                                            `}
                                                            placeholder="例如: J01"
                                                        />
                                                    </div>
                                                    
                                                    {/* 姓名欄位 */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700">姓名</label>
                                                        <input 
                                                            type="text" 
                                                            name="name"
                                                            value={formData.name}
                                                            onChange={handleFormChange}
                                                            className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                            placeholder="評審真實姓名"
                                                        />
                                                    </div>

                                                    {/* 密碼欄位 */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700">密碼</label>
                                                        <input 
                                                            type="text" 
                                                            name="password"
                                                            value={formData.password}
                                                            onChange={handleFormChange}
                                                            className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-secondary focus:border-secondary sm:text-sm"
                                                            placeholder="登入密碼"
                                                        />
                                                    </div>

                                                    {/* 組別 Checkbox 區塊 */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-2">負責評分組別</label>
                                                        <div className="grid grid-cols-2 gap-2 border rounded-md p-3 bg-gray-50 max-h-48 overflow-y-auto">
                                                            {ALL_CATEGORIES.map(category => (
                                                                <label key={category} className="inline-flex items-center space-x-2 cursor-pointer">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        className="form-checkbox text-secondary h-4 w-4 rounded border-gray-300 focus:ring-secondary"
                                                                        checked={formData.categories.includes(category)}
                                                                        onChange={() => handleCategoryToggle(category)}
                                                                    />
                                                                    <span className="text-sm text-gray-700">{category}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                                        <button 
                                            type="button" 
                                            onClick={handleSave}
                                            disabled={isSaving}
                                            className={`w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white sm:ml-3 sm:w-auto sm:text-sm
                                                ${isSaving ? 'bg-gray-400' : 'bg-secondary hover:bg-orange-700'}
                                            `}
                                        >
                                            {isSaving ? '儲存中...' : '儲存'}
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => setIsModalOpen(false)}
                                            className="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm"
                                        >
                                            取消
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 管理員儀表板 (AdminDashboard) ---
        const AdminDashboard = ({ user, onLogout }) => {
            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Top Navbar */}
                    <nav className="bg-primary shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center">
                                    <div className="flex-shrink-0">
                                        <span className="text-white font-bold text-lg flex items-center">
                                            <span className="material-icons mr-2">admin_panel_settings</span>
                                            管理員後台
                                        </span>
                                    </div>
                                </div>
                                <div className="flex items-center">
                                    <span className="text-gray-300 text-sm mr-4">Hi, Administrator</span>
                                    <button 
                                        onClick={onLogout}
                                        className="bg-gray-800 p-1 rounded-full text-gray-400 hover:text-white focus:outline-none"
                                        title="登出"
                                    >
                                        <span className="material-icons">logout</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
                        {/* 這裡未來可以放更多管理功能，目前只顯示評審管理 */}
                        <JudgeManager />
                    </main>
                </div>
            );
        };

        // --- 主程式 App ---
        const App = () => {
            const [user, setUser] = useState(null);

            useEffect(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        setUser(JSON.parse(storedUser));
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                    }
                }
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('currentUser');
                setUser(null);
            };

            // 根據 user.role 決定渲染畫面
            const renderContent = () => {
                if (!user) {
                    return <Login onLoginSuccess={setUser} />;
                }

                if (user.role === 'admin') {
                    return <AdminDashboard user={user} onLogout={handleLogout} />;
                }

                // Judge (評審) 的畫面 - 暫時保留原樣
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
                        <div className="bg-white p-8 rounded shadow text-center">
                            <h2 className="text-2xl font-bold text-primary mb-4">歡迎回來！</h2>
                            <p className="text-lg mb-2">
                                {user.judge_name} 老師
                            </p>
                            <p className="text-gray-500 mb-6">
                                {user.role === 'judge' && `負責組別：${user.category || '未指定'}`}
                            </p>
                            <button 
                                onClick={handleLogout}
                                className="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
                            >
                                登出系統
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <React.StrictMode>
                    {renderContent()}
                </React.StrictMode>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報達人擂台賽評分系統 (Dev)</title>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(message);
        };
    </script>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3E2723',
                        secondary: '#D84315',
                    }
                }
            }
        }
    </script>

    <!-- React 核心 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F5F5F5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        if (typeof React === 'undefined') {
            alert("錯誤：React 無法載入，請檢查網路。");
        }

        const { useState, useEffect } = React;

        // ================= CONFIG 設定區 =================

        // 1. Google Apps Script 部署網址 (後端 API)
        const API_URL = "https://script.google.com/macros/s/AKfycbwLRsiyHMiQzqyk52CBkmnASqJUznH3JWW50rzKNRNAuRGY5Ci8-IQNKxOOnxE99vLq/exec";
        
        // 2. API Key
        const API_KEY = "TEST_KEY_123"; 

        // =================================================================

        // --- 登入頁面元件 ---
        const Login = ({ onLoginSuccess }) => {
            const [userType, setUserType] = useState('judge');
            const [formData, setFormData] = useState({ id: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            // 評審名單狀態 (從 API 抓取)
            const [judgeList, setJudgeList] = useState([]);
            const [isListLoading, setIsListLoading] = useState(false);

            // 當切換到評審身分時，呼叫後端 API 抓名單
            useEffect(() => {
                if (userType === 'judge') {
                    fetchJudgeList();
                }
            }, [userType]);

            const fetchJudgeList = async () => {
                setIsListLoading(true);
                try {
                    // 呼叫後端 API: getJudgeList
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getJudgeList',
                            API_Key: API_KEY
                        })
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        setJudgeList(result.data);
                        console.log("已載入評審名單:", result.data);
                    } else {
                        console.warn("無法載入評審名單:", result.message);
                    }

                } catch (err) {
                    console.error("無法載入評審名單", err);
                    setError("無法連接伺服器讀取評審名單");
                } finally {
                    setIsListLoading(false);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (error) setError('');
            };

            const handleUserTypeChange = (e) => {
                setUserType(e.target.value);
                setFormData({ id: '', password: '' });
                setError('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                if (userType === 'judge' && !formData.id) {
                    setError('請選擇評審姓名');
                    setLoading(false);
                    return;
                }
                if (!formData.password) {
                    setError('請輸入密碼');
                    setLoading(false);
                    return;
                }

                try {
                    const payload = {
                        action: 'login',
                        API_Key: API_KEY, 
                        user_type: userType,
                        id: userType === 'judge' ? formData.id : '', 
                        password: formData.password
                    };

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        localStorage.setItem('currentUser', JSON.stringify(result.data));
                        onLoginSuccess(result.data);
                    } else {
                        setError(result.message || '登入失敗，請檢查帳號密碼。');
                    }

                } catch (err) {
                    console.error('Login Error:', err);
                    setError('無法連接伺服器，請檢查網路或 API 網址。');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-primary">
                        
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-bold text-primary mb-2">
                                114學年度 簡報達人擂台賽
                            </h1>
                            <p className="text-gray-500 font-medium">評審評分系統</p>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-200 flex items-center">
                                <span className="material-icons text-sm mr-2">error</span>
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-6">
                            
                            {/* 身分選擇 */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    登入身分
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">badge</span>
                                    <select 
                                        value={userType}
                                        onChange={handleUserTypeChange}
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                    >
                                        <option value="judge">評審委員 (Judge)</option>
                                        <option value="admin">系統管理員 (Admin)</option>
                                    </select>
                                </div>
                            </div>

                            {/* 動態評審姓名選單 */}
                            {userType === 'judge' && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        評審姓名
                                        {isListLoading && <span className="text-xs text-gray-400 ml-2">(資料載入中...)</span>}
                                    </label>
                                    <div className="relative">
                                        <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">person</span>
                                        <select 
                                            name="id" 
                                            value={formData.id} 
                                            onChange={handleChange} 
                                            className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary bg-white"
                                            disabled={isListLoading}
                                        >
                                            <option value="">
                                                {isListLoading ? "讀取中..." : "請選擇您的姓名..."}
                                            </option>
                                            
                                            {judgeList.length > 0 ? (
                                                judgeList.map((judge) => (
                                                    <option key={judge.id} value={judge.id}>
                                                        {judge.name}
                                                    </option>
                                                ))
                                            ) : (
                                                !isListLoading && <option value="" disabled>無可用名單</option>
                                            )}
                                        </select>
                                    </div>
                                </div>
                            )}

                            {/* 密碼輸入 */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    {userType === 'admin' ? '管理員密碼' : '登入密碼'}
                                </label>
                                <div className="relative">
                                    <span className="material-icons absolute left-3 top-3 text-gray-400 text-sm">lock</span>
                                    <input
                                        type="password"
                                        name="password"
                                        value={formData.password}
                                        onChange={handleChange}
                                        placeholder="請輸入密碼"
                                        className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-secondary focus:border-secondary"
                                    />
                                </div>
                            </div>

                            {/* 按鈕 */}
                            <button 
                                type="submit"
                                disabled={loading}
                                className={`w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors
                                    ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-secondary hover:bg-orange-700'}
                                `}
                            >
                                {loading ? "登入驗證中..." : "登入系統"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 主程式 App ---
        const App = () => {
            const [user, setUser] = useState(null);

            useEffect(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        setUser(JSON.parse(storedUser));
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                    }
                }
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('currentUser');
                setUser(null);
            };

            return (
                <React.StrictMode>
                    { !user ? (
                        <Login onLoginSuccess={setUser} />
                    ) : (
                        <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
                            <div className="bg-white p-8 rounded shadow text-center">
                                <h2 className="text-2xl font-bold text-primary mb-4">歡迎回來！</h2>
                                <p className="text-lg mb-2">
                                    {user.role === 'admin' ? '系統管理員' : `${user.judge_name} 老師`}
                                </p>
                                <p className="text-gray-500 mb-6">
                                    {user.role === 'judge' && `負責組別：${user.category}`}
                                </p>
                                <button 
                                    onClick={handleLogout}
                                    className="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
                                >
                                    登出系統
                                </button>
                            </div>
                        </div>
                    )}
                </React.StrictMode>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                                        <input type="checkbox" name="is_judging_open" checked={config.is_judging_open} onChange={handleConfigChange} className="sr-only" />
                                        <div className={`block w-10 h-6 rounded-full transition-colors ${config.is_judging_open ? 'bg-orange-500' : 'bg-gray-300'}`}></div>
                                        <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${config.is_judging_open ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                    <div className="ml-3 text-sm font-medium text-gray-700">開放評審登入與評分</div>
                                </label>
                            </div>
                            <hr className="border-gray-100" />
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">參賽組別管理</label>
                                <div className="flex gap-2 mb-3">
                                    <input 
                                        type="text" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleAddCategory()}
                                        placeholder="輸入新組別名稱..." className="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <button onClick={handleAddCategory} className="bg-gray-800 text-white px-4 py-2 rounded-md text-sm hover:bg-gray-700 transition">新增</button>
                                </div>
                                <div className="flex flex-wrap gap-2 p-3 bg-gray-50 border border-gray-200 rounded-md min-h-[80px]">
                                    {flatCategories.length > 0 ? (
                                        flatCategories.map((cat, idx) => (
                                            <span key={idx} className="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-indigo-100 text-indigo-800 border border-indigo-200">
                                                {cat}
                                                <button onClick={() => handleRemoveCategory(cat)} className="ml-2 flex-shrink-0 text-indigo-500 hover:text-indigo-900 focus:outline-none">
                                                    <span className="material-icons text-[14px]">cancel</span>
                                                </button>
                                            </span>
                                        ))
                                    ) : <span className="text-sm text-gray-400 italic">目前無設定任何組別</span>}
                                </div>
                            </div>
                        </div>
                        <div className="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end rounded-b-lg">
                            <button onClick={saveSystemConfig} disabled={isConfigSaving} className={`px-6 py-2 rounded shadow-sm text-sm font-bold text-white transition-all ${isConfigSaving ? 'bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {isConfigSaving ? '儲存中...' : '儲存系統設定'}
                            </button>
                        </div>
                    </div>

                    {/* 右半部：評審名單管理 */}
                    <div className="bg-white rounded-lg shadow-md border border-gray-200 flex flex-col">
                        <div className="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-gray-800 flex items-center">
                                <span className="material-icons text-green-600 mr-2">how_to_reg</span>
                                評審名單管理
                            </h3>
                            <button onClick={() => openJudgeModal('add')} className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded text-sm font-medium flex items-center shadow-sm transition">
                                <span className="material-icons text-sm mr-1">person_add</span> 新增
                            </button>
                        </div>
                        <div className="p-0 flex-1 overflow-hidden flex flex-col">
                            <div className="overflow-x-auto overflow-y-auto max-h-[600px] flex-1 p-2">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">年度</th>
                                            <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">代碼</th>
                                            <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th>
                                            <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">負責組別</th>
                                            <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {isJudgesLoading ? <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-500">載入中...</td></tr> : judges.length === 0 ? <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-500">此年度目前無評審資料</td></tr> : judges.map((judge, idx) => (
                                            <tr key={judge.judge_code || idx} className="hover:bg-gray-50 border-b">
                                                <td className="px-4 py-3 text-sm text-gray-500">{judge.competition_year}</td>
                                                <td className="px-4 py-3 text-sm font-mono text-gray-900">{judge.judge_code}</td>
                                                <td className="px-4 py-3 text-sm font-bold text-gray-900">{judge.judge_name}</td>
                                                <td className="px-4 py-3 text-sm text-gray-600">
                                                    <div className="flex flex-wrap gap-1">
                                                        {(judge.categories || []).map(cat => <span key={cat} className="text-[10px] bg-gray-100 border border-gray-200 px-1.5 py-0.5 rounded text-gray-600 whitespace-nowrap">{cat}</span>)}
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3 text-sm text-right whitespace-nowrap">
                                                    <button onClick={() => openJudgeModal('edit', judge)} className="text-blue-600 hover:text-blue-800 mr-3"><span className="material-icons text-base">edit</span></button>
                                                    <button onClick={() => deleteJudge(judge.judge_code, judge.judge_name)} className="text-red-500 hover:text-red-700"><span className="material-icons text-base">delete</span></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                {/* 評審新增/編輯 Modal */}
                {isJudgeModalOpen && (
                    <div className="fixed inset-0 z-50 overflow-y-auto">
                        <div className="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
                            <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onClick={() => setIsJudgeModalOpen(false)}></div>
                            <span className="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                            <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl w-full">
                                <div className="bg-green-700 px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-white flex items-center">
                                        <span className="material-icons mr-2">{judgeModalMode === 'add' ? 'person_add' : 'manage_accounts'}</span>
                                        {judgeModalMode === 'add' ? '新增評審帳號' : '編輯評審資料'}
                                    </h3>
                                    <button onClick={() => setIsJudgeModalOpen(false)} className="text-green-200 hover:text-white transition-colors"><span className="material-icons">close</span></button>
                                </div>
                                <div className="px-6 py-6 bg-gray-50">
                                    <div className="space-y-5">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">年度</label>
                                                <input type="number" name="Competition_Year" value={judgeFormData.Competition_Year} readOnly className="w-full bg-gray-100 border border-gray-300 rounded px-3 py-2 text-gray-500 cursor-not-allowed" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">評審代碼</label>
                                                <input type="text" name="Judge_Code" value={judgeFormData.Judge_Code} onChange={handleJudgeFormChange} disabled={judgeModalMode === 'edit'} placeholder="例如: J01" className={`w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 ${judgeModalMode === 'edit' ? 'bg-gray-200 text-gray-500' : 'bg-white border-gray-300'}`} />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">評審姓名</label>
                                                <input type="text" name="Judge_Name" value={judgeFormData.Judge_Name} onChange={handleJudgeFormChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">登入密碼</label>
                                                <input type="text" name="Password" value={judgeFormData.Password} onChange={handleJudgeFormChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500" />
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded border border-gray-200">
                                            <label className="block text-sm font-bold text-gray-700 mb-3 border-b pb-2">負責評分組別</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-48 overflow-y-auto">
                                                {flatCategories.length > 0 ? flatCategories.map(cat => (
                                                    <label key={cat} className="flex items-center space-x-2 cursor-pointer p-2 hover:bg-green-50 rounded border border-transparent hover:border-green-100 transition">
                                                        <input type="checkbox" checked={judgeFormData.Categories.includes(cat)} onChange={() => handleJudgeCategoryToggle(cat)} className="form-checkbox text-green-600 h-4 w-4 rounded border-gray-300 focus:ring-green-500" />
                                                        <span className="text-sm text-gray-700">{cat}</span>
                                                    </label>
                                                )) : <span className="text-sm text-red-500 italic">請先至左側新增組別。</span>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-gray-100 px-6 py-4 flex flex-row-reverse gap-3 border-t border-gray-200">
                                    <button onClick={saveJudge} disabled={isJudgeSaving} className={`px-6 py-2 rounded shadow-sm text-sm font-bold text-white transition-all ${isJudgeSaving ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700'}`}>
                                        {isJudgeSaving ? '儲存中...' : '儲存評審'}
                                    </button>
                                    <button onClick={() => setIsJudgeModalOpen(false)} className="px-5 py-2 bg-white border border-gray-300 rounded shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">
                                        取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };;
    
// --- 管理員後台框架 (AdminDashboard) --- 20280228 1812 update
    const AdminDashboard = ({ user, onLogout }) => {
        // 控制目前顯示的分頁: 'teams' 或 'settings'
        const [currentTab, setCurrentTab] = useState('teams');
        
        // 全域年度切換狀態，預設抓今年的民國年 (例如 115)
        const [selectedYear, setSelectedYear] = useState((new Date().getFullYear() - 1911).toString());
        
        // 產生下拉選單的年度選項 (前後幾年)
        const yearOptions = ['112', '113', '114', '115', '116', '117'];

        return (
            <div className="min-h-screen bg-gray-100 pb-10">
                {/* Top Navbar */}
                <nav className="bg-primary shadow-lg sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center">
                                <span className="material-icons text-white mr-2">admin_panel_settings</span>
                                <span className="font-bold text-xl text-white mr-6">管理員後台</span>
                                
                                {/* 全域年度切換器 */}
                                <div className="flex items-center bg-white/20 px-3 py-1.5 rounded text-white">
                                    <span className="material-icons text-sm mr-1">calendar_today</span>
                                    <span className="text-sm font-medium mr-2">管理年度:</span>
                                    <select 
                                        value={selectedYear}
                                        onChange={(e) => setSelectedYear(e.target.value)}
                                        className="bg-white text-gray-800 text-sm font-bold rounded px-2 py-0.5 border-none focus:ring-2 focus:ring-secondary cursor-pointer"
                                    >
                                        {yearOptions.map(y => (
                                            <option key={y} value={y}>{y} 年度</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="text-gray-200 text-sm hidden sm:block">Hello, Admin</span>
                                <button 
                                    onClick={onLogout}
                                    className="bg-gray-800 text-gray-300 hover:text-white px-3 py-1 rounded text-sm transition flex items-center"
                                >
                                    <span className="material-icons text-sm mr-1">logout</span>
                                    登出
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>

                {/* Main Content Area */}
                <main className="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                    
                    {/* Page Title & Tabs */}
                    <div className="mb-6">
                        <div className="sm:hidden">
                            <select 
                                value={currentTab} 
                                onChange={(e) => setCurrentTab(e.target.value)}
                                className="block w-full rounded-md border-gray-300 focus:border-secondary focus:ring-secondary"
                            >
                                <option value="teams">隊伍資源管理 (Teams)</option>
                                <option value="settings">系統設定與評審 (Settings)</option>
                            </select>
                        </div>
                        <div className="hidden sm:block">
                            <div className="border-b border-gray-200">
                                <nav className="-mb-px flex space-x-8" aria-label="Tabs">
                                    <button
                                        onClick={() => setCurrentTab('teams')}
                                        className={`
                                            ${currentTab === 'teams'
                                                ? 'border-secondary text-secondary'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }
                                            whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center transition-colors
                                        `}
                                    >
                                        <span className="material-icons mr-2 text-base">groups</span>
                                        隊伍資源管理
                                    </button>

                                    <button
                                        onClick={() => setCurrentTab('settings')}
                                        className={`
                                            ${currentTab === 'settings'
                                                ? 'border-secondary text-secondary'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }
                                            whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center transition-colors
                                        `}
                                    >
                                        <span className="material-icons mr-2 text-base">settings</span>
                                        系統設定與評審
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </div>

                    {/* Conditional Rendering：把 selectedYear 當作 Prop 傳給子元件 */}
                    <div className="transition-opacity duration-300">
                        {currentTab === 'teams' ? (
                            <TeamManager selectedYear={selectedYear} />
                        ) : (
                            <SystemSettings selectedYear={selectedYear} />
                        )}
                    </div>
                </main>
            </div>
        );
    };

    // --- 主程式 App ---
    const App = () => {
        const [user, setUser] = useState(null);

        useEffect(() => {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    setUser(JSON.parse(storedUser));
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        }, []);

        const handleLogout = () => {
            localStorage.removeItem('currentUser');
            setUser(null);
        };

        // 根據 user.role 路由
        const renderContent = () => {
            if (!user) {
                return <Login onLoginSuccess={setUser} />;
            }

            // 若是管理員 -> AdminDashboard
            if (user.role === 'admin') {
                return <AdminDashboard user={user} onLogout={handleLogout} />;
            }

            // 若是評審 -> 原本的歡迎畫面 (之後會開發評審儀表板)
            return (
                <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
                    <div className="bg-white p-8 rounded shadow text-center border-t-4 border-secondary">
                        <h2 className="text-2xl font-bold text-primary mb-4">歡迎回來！</h2>
                        <p className="text-lg mb-2 font-medium">{user.judge_name} 老師</p>
                        <div className="bg-orange-50 p-4 rounded mb-6 text-left">
                            <p className="text-sm text-gray-500 mb-1">您負責的評分組別：</p>
                            <div className="flex flex-wrap gap-2">
                                {user.category ? (
                                    // 假設這裡後端回傳的是字串，先 split 處理，若已是陣列則直接用
                                    (Array.isArray(user.category) ? user.category : user.category.split(',')).map(c => (
                                        <span key={c} className="bg-white border border-secondary text-secondary px-2 py-1 rounded text-sm">
                                            {c}
                                        </span>
                                    ))
                                ) : (
                                    <span className="text-gray-400">尚未分配</span>
                                )}
                            </div>
                        </div>
                        <button 
                            onClick={handleLogout}
                            className="px-6 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
                        >
                            登出系統
                        </button>
                    </div>
                </div>
            );
        };

        return (
            <React.StrictMode>
                {renderContent()}
            </React.StrictMode>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
